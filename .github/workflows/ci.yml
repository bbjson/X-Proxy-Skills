name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 语法检查
        run: python -m py_compile scripts/xps.py
      - name: 冒烟测试（离线，临时 HOME）
        run: bash tests/smoke.sh
      - name: shellcheck（存在则跑）
        run: |
          if command -v shellcheck >/dev/null; then
            shellcheck bin/xps install.sh tests/smoke.sh || true
          fi
